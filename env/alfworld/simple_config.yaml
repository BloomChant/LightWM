# Minimal ALFWorld configuration for local text-game runs.

dataset:
  # Data paths can be relative; the wrapper resolves them from the project root.
  # Adjust these paths to match the local ALFWorld data layout.
  #
  # The train path is also set to an existing split so ALFWorld initialization
  # does not fail if train data is not available.
  data_path: './data/alfworld/valid_seen'
  eval_id_data_path: './data/alfworld/valid_seen'
  eval_ood_data_path: './data/alfworld/valid_unseen'
  num_train_games: 10  # Small default for quick local checks.
  num_eval_games: 5

logic:
  # Logic file paths.
  domain: '$ALFWORLD_DATA/logic/alfred.pddl'
  grammar: '$ALFWORLD_DATA/logic/alfred.twl2'

env:
  # Environment type: 'AlfredTWEnv', 'AlfredThorEnv', or 'AlfredHybrid'.
  type: 'AlfredTWEnv'
  domain_randomization: False
  task_types: [1, 2, 3, 4, 5, 6]  # All ALFWorld task types.
  expert_timeout_steps: 150
  expert_type: "handcoded"
  goal_desc_human_anns_prob: 0.0

general:
  random_seed: 42
  use_cuda: False  # Set to True only when CUDA is available.
  visdom: False
  task: 'alfred'
  training_method: 'dagger'
  save_path: './training/'
  observation_pool_capacity: 3
  hide_init_receptacles: False

  training:
    batch_size: 1
    max_episode: 100
    smoothing_eps: 0.1
    optimizer:
      learning_rate: 0.001
      clip_grad_norm: 5

  evaluate:
    run_eval: True
    batch_size: 1
    env:
      type: "AlfredTWEnv"

  checkpoint:
    report_frequency: 10
    experiment_tag: 'random_agent_test'
    load_pretrained: False
    load_from_tag: 'not loading anything'

  model:
    encoder_layers: 1
    decoder_layers: 1
    encoder_conv_num: 5
    block_hidden_dim: 64
    n_heads: 1
    dropout: 0.1
    block_dropout: 0.1
    recurrent: True

dagger:
  action_space: "admissible"
  max_target_length: 20
  beam_width: 10
  generate_top_k: 5
  unstick_by_beam_search: False

  training:
    max_nb_steps_per_episode: 50

  fraction_assist:
    fraction_assist_anneal_episodes: 50000
    fraction_assist_anneal_from: 1.0
    fraction_assist_anneal_to: 0.01

  fraction_random:
    fraction_random_anneal_episodes: 0
    fraction_random_anneal_from: 0.0
    fraction_random_anneal_to: 0.0

  replay:
    replay_memory_capacity: 500000
    update_per_k_game_steps: 5
    replay_batch_size: 64
    replay_sample_history_length: 4
    replay_sample_update_from: 2
